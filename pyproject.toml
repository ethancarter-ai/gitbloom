[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitbloom"
version = "0.1.0"
description = "Detect and prune stale comment blocks at the ends of files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ProjectCreationAgent", email = "agent@example.invalid" }]
keywords = ["cli", "git", "bloom", "comments", "maintenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Maintenance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gitbloom = "gitbloom.cli:main"

[project.urls]
Repository = "https://github.com/ethancarter-ai/gitbloom"
"Bug Tracker" = "https://github.com/ethancarter-ai/gitbloom/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
